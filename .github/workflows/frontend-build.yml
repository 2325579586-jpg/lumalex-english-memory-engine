name: Application quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    name: API tests, backend tests, and frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install API dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pip-audit==2.9.0

      - name: Audit Python dependencies
        run: python -m pip_audit -r backend/requirements.txt

      - name: Validate API syntax
        run: npm run check:api

      - name: Run API and backend tests
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
